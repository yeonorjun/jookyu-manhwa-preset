<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jookyu Manhwa Preset · Chronicles</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Marcellus&display=swap');
*{box-sizing:border-box}
:root{
  --paper:#fbf4ec;
  --paper2:#f7e9e8;
  --mist:#eaf2f6;
  --gold:#b58a62;
  --gold2:#d5b18f;
  --rose:#c995a5;
  --blue:#9dbddd;
  --ink:#5f6675;
  --muted:#ab9595;
}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:26px;
  background:
    radial-gradient(circle at 18% 10%,rgba(255,255,255,.95),transparent 24%),
    radial-gradient(circle at 85% 86%,rgba(183,211,229,.42),transparent 30%),
    linear-gradient(140deg,#e9e3df 0%,#e8eef2 52%,#f1e2e7 100%);
  font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink);
}
.chronicle{
  position:relative;width:min(430px,100%);overflow:hidden;padding:16px 16px 14px;
  border:1px solid rgba(181,138,98,.50);border-radius:27px;
  background:
    radial-gradient(circle at 16% 12%,rgba(255,255,255,.96),transparent 27%),
    radial-gradient(circle at 88% 78%,rgba(209,226,237,.40),transparent 34%),
    linear-gradient(145deg,rgba(251,244,236,.99),rgba(247,233,233,.975) 55%,rgba(235,242,246,.985));
  box-shadow:0 25px 58px rgba(78,82,91,.18),inset 0 1px 0 rgba(255,255,255,.98),inset 0 -10px 30px rgba(181,138,98,.045);
  animation:floatPlaque 6.2s ease-in-out infinite;
}
@keyframes floatPlaque{
  0%,100%{transform:translateY(0);box-shadow:0 25px 58px rgba(78,82,91,.18),inset 0 1px 0 rgba(255,255,255,.98),inset 0 -10px 30px rgba(181,138,98,.045)}
  50%{transform:translateY(-7px);box-shadow:0 31px 64px rgba(78,82,91,.21),inset 0 1px 0 rgba(255,255,255,1),inset 0 -10px 30px rgba(181,138,98,.055)}
}
.chronicle:before{
  content:"";position:absolute;inset:7px;border:1px solid rgba(181,138,98,.17);
  border-radius:21px;pointer-events:none;box-shadow:inset 0 0 25px rgba(255,255,255,.34);
}
  50%{transform:translate(11px,-8px) rotate(62deg);opacity:.82}
}
.art{position:absolute;z-index:1;pointer-events:none;user-select:none}
.content{position:relative;z-index:5}
.header{text-align:center;padding:2px 50px 9px}
.kicker{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#bb957d}
.title{margin:3px 0 1px;font-family:Marcellus,Georgia,serif;font-size:23px;letter-spacing:.065em;color:#946c58;text-shadow:0 1px 0 #fff}
.rule{font-size:11px;letter-spacing:.33em;color:#d1ad8d}
.topGrid{display:grid;grid-template-columns:1.14fr .86fr;gap:9px}
.panel{
  position:relative;overflow:hidden;border:1px solid rgba(181,138,98,.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.84),0 8px 18px rgba(89,91,100,.05);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.panel:hover{transform:translateY(-3px);border-color:rgba(181,138,98,.48);box-shadow:inset 0 1px 0 rgba(255,255,255,.94),0 12px 26px rgba(89,91,100,.09)}
.datePanel{
  padding:11px 12px;border-radius:19px 25px 17px 21px;
  background:linear-gradient(135deg,rgba(255,252,247,.79),rgba(246,228,230,.67));
  display:flex;align-items:center;gap:11px;
}
.day{
  width:45px;height:45px;border-radius:15px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(241,218,224,.64));
  border:1px solid rgba(181,138,98,.20);box-shadow:inset 0 1px 0 rgba(255,255,255,.88),0 0 14px rgba(213,177,150,.11);
  font-family:Marcellus,Georgia,serif;font-size:25px;color:#9f7180;
}
.small{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#b27e6e}
.month{margin-top:2px;font-size:17px;line-height:1.02;font-weight:600;color:#596575}
.dateSub{margin-top:3px;font-size:10px;color:#b09a96}
.momentPanel{
  padding:10px 11px;border-radius:24px 18px 22px 16px;
  background:linear-gradient(135deg,rgba(243,238,246,.76),rgba(237,247,242,.73));
  display:flex;align-items:center;gap:8px;
}
.momentArt{width:28px;height:36px;flex:none;filter:drop-shadow(0 0 9px rgba(189,157,122,.18))}
.moment{font-size:17px;line-height:1.02;font-weight:600;color:#596475;margin-top:2px}
.weather{font-size:12px;color:#806d76;margin-top:2px}
.moonArt{width:33px;height:33px;flex:none;margin-left:auto;filter:drop-shadow(0 0 10px rgba(155,186,221,.28))}
.scene{
  margin-top:9px;padding:11px 12px 12px;border-radius:22px 18px 24px 17px;
  background:linear-gradient(145deg,rgba(255,252,247,.63),rgba(247,239,239,.52));
}
.sceneArt{
  position:absolute;right:-10px;bottom:-14px;width:205px;height:124px;object-fit:contain;opacity:.28;
  filter:saturate(.76) drop-shadow(0 0 15px rgba(155,183,207,.16));
}
.sceneInner{position:relative;z-index:2}
.sceneHead{display:flex;justify-content:space-between;align-items:center;padding-bottom:7px;border-bottom:1px solid rgba(181,138,98,.17)}
.sceneTitle{font-family:Marcellus,Georgia,serif;font-size:12px;letter-spacing:.12em;color:#986e5e}
.spark{font-size:13px;color:#c9a17f;animation:spark 2.8s ease-in-out infinite}
@keyframes spark{0%,100%{opacity:.30;transform:scale(.84) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(12deg)}}
.sceneRow{display:grid;grid-template-columns:24px 1fr;gap:8px;margin-top:9px}
.sceneMark{
  width:24px;height:24px;border-radius:9px;display:grid;place-items:center;
  background:rgba(255,255,255,.55);border:1px solid rgba(181,138,98,.17);color:#b58a62;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);font-size:11px;
}
.sceneLabel{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#b37f6f}
.sceneValue{font-size:16px;line-height:1.08;font-weight:600;color:#596575}
.eventValue{font-size:15px;line-height:1.15;color:#796872}
.status{margin-top:10px;padding:10px 12px 9px;border-radius:18px 23px 17px 21px;background:linear-gradient(135deg,rgba(255,251,247,.61),rgba(238,245,248,.51));}
.statusHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:7px}
.statusTitle{font-family:Marcellus,Georgia,serif;font-size:12px;letter-spacing:.12em;color:#956c5b}
.statusNote{font-size:10px;color:#baa19a}
.statusStats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{margin:4px 0}
.statRow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#6b6870}
.statRow b{font-size:15px;color:#5c6878}
.track{
  height:8px;margin-top:4px;border-radius:999px;overflow:hidden;
  background:rgba(100,112,126,.08);border:1px solid rgba(255,255,255,.9);
  box-shadow:inset 0 1px 2px rgba(83,96,113,.08);
}
.fill{
  height:100%;border-radius:999px;width:var(--lo);
  animation:drift var(--speed) ease-in-out infinite;animation-delay:var(--delay);
  box-shadow:0 0 12px var(--glow);will-change:width;
}
@keyframes drift{
  0%,100%{width:var(--lo)}
  42%,63%{width:var(--hi)}
}
.vigor{--lo:71%;--hi:82%;--speed:5.8s;--delay:-1.1s;--glow:rgba(200,149,139,.30);background:linear-gradient(90deg,#d9b8ad,#c58e86)}
.magic{--lo:62%;--hi:74%;--speed:7.7s;--delay:-4.0s;--glow:rgba(116,164,216,.34);background:linear-gradient(90deg,#c6dbec,#88acd2)}

.artBloom,.artMoon{position:absolute;z-index:1;pointer-events:none;filter:saturate(.82) sepia(.08);mix-blend-mode:multiply;opacity:.18}.artBloom{left:-18px;top:0;width:150px;transform:rotate(-7deg)}.artBloom img,.artMoon img{width:100%;display:block}.artMoon{right:-25px;top:4px;width:150px;opacity:.12;transform:rotate(2deg)}.sceneArtImg{position:absolute;right:-28px;bottom:-38px;width:270px;height:175px;object-fit:cover;object-position:center 60%;opacity:.18;mix-blend-mode:multiply;filter:saturate(.72) sepia(.08);mask-image:linear-gradient(90deg,transparent 0%,#000 28%,#000 82%,transparent 100%)}
.footer{text-align:center;margin-top:7px;font-size:9px;letter-spacing:.22em;color:#bc9882}
.footer:before,.footer:after{content:"";display:inline-block;width:34px;height:1px;vertical-align:middle;background:linear-gradient(90deg,transparent,#caa477);margin:0 7px}
.footer:after{background:linear-gradient(90deg,#caa477,transparent)}
@media(max-width:390px){.topGrid{grid-template-columns:1fr}.header{padding-left:38px;padding-right:38px}}
</style>
</head>
<body>
<div class="chronicle">
  <div class="glow"></div>
  <div class="artBloom"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/John_Reinhard_Weguelin_%E2%80%93_Cherry_Blossom_%281905%29.jpg" alt=""></div>
  <div class="artMoon"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/The_Harvest_Moon_-_Charles_Rennie_Mackintosh_-_1892.jpg" alt=""></div>
  <div class="content">
    <div class="header">
      <div class="kicker">Empire Календарь</div>
      <div class="title">ХРОНИКИ ИМПЕРИИ</div>
      <div class="rule">✦ · · · ✦</div>
    </div>

    <div class="topGrid">
      <div class="panel datePanel">
        <div class="day">14</div>
        <div style="min-width:0">
          <div class="small">Дата</div>
          <div class="month">Серебряной Луны</div>
          <div class="dateSub">четырнадцатый день</div>
        </div>
      </div>

      <div class="panel momentPanel">
        <svg class="momentArt" viewBox="0 0 60 90" aria-hidden="true">
          <defs><linearGradient id="glass" x1="0" x2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#d9e5ef"/><stop offset="1" stop-color="#b69778"/></linearGradient></defs>
          <path d="M16 8h28M16 82h28M19 10c0 17 9 17 9 25s-9 8-9 25M41 10c0 17-9 17-9 25s9 8 9 25" fill="none" stroke="url(#glass)" stroke-width="4" stroke-linecap="round"/>
          <path d="M28 48c5-4 9-3 11 0l-3 10H25z" fill="#d8b2be" opacity=".8"/>
        </svg>
        <div style="min-width:0">
          <div class="small">Время суток</div>
          <div class="moment">Полночь</div>
          <div class="weather">Ясная ночь</div>
        </div>
        <svg class="moonArt" viewBox="0 0 70 70" aria-hidden="true">
          <defs><radialGradient id="m2"><stop stop-color="#fff"/><stop offset=".8" stop-color="#ede5ee"/><stop offset="1" stop-color="#cbb9ce"/></radialGradient></defs>
          <circle cx="35" cy="35" r="21" fill="url(#m2)"/><circle cx="43" cy="28" r="19" fill="#eef2f5"/>
          <path d="M16 20c8-5 13-6 18-6M49 49c5-2 8-5 10-9" fill="none" stroke="#c8a57f" stroke-width="1.6" opacity=".7"/>
        </svg>
      </div>
    </div>

    <div class="panel scene">
      <img class="sceneArtImg" src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Beiteddine_Palace_%28Watercolor%29.png" alt=""><div class="sceneInner">
        <div class="sceneHead"><div class="sceneTitle">ТЕКУЩАЯ СЦЕНА</div><div class="spark">✧</div></div>

        <div class="sceneRow">
          <div class="sceneMark">⌖</div>
          <div><div class="sceneLabel">Место</div><div class="sceneValue">Северное крыло дворца</div></div>
        </div>

        <div class="sceneRow">
          <div class="sceneMark">✦</div>
          <div><div class="sceneLabel">Событие</div><div class="eventValue">Тайная аудиенция с наследным принцем</div></div>
        </div>
      </div>
    </div>

    <div class="panel status">
      <div class="statusHead"><div class="statusTitle">СОСТОЯНИЕ</div><div class="statusNote">текущий запас</div></div>

      <div class="statusStats"><div class="stat"><div class="statRow"><span>Бодрость</span><b>82%</b></div>
        <div class="track"><div class="fill vigor"></div></div>
      </div>

      <div class="stat">
        <div class="statRow"><span>Мана</span><b>74%</b></div>
        <div class="track"><div class="fill magic"></div></div>
      </div>

      
      <div class="resourceGem"></div>
    </div>

    <div class="footer">ИМПЕРСКИЙ КАЛЕНДАРЬ</div>
  </div>
</div>
</body>
</html>
