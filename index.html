@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Marcellus&display=swap');
*{box-sizing:border-box}:root{--paper:#fbf4ec;--ink:#5f6675;--gold:#b58a62;--rose:#c995a5;--blue:#9dbddd}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:26px;background:radial-gradient(circle at 18% 10%,rgba(255,255,255,.95),transparent 24%),radial-gradient(circle at 85% 86%,rgba(183,211,229,.42),transparent 30%),linear-gradient(140deg,#e9e3df,#e8eef2 52%,#f1e2e7);font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink)}
.chronicle{position:relative;width:min(430px,100%);overflow:hidden;padding:16px;border:1px solid rgba(181,138,98,.5);border-radius:27px;background:radial-gradient(circle at 16% 12%,rgba(255,255,255,.96),transparent 27%),radial-gradient(circle at 88% 78%,rgba(209,226,237,.4),transparent 34%),linear-gradient(145deg,rgba(251,244,236,.99),rgba(247,233,233,.975) 55%,rgba(235,242,246,.985));box-shadow:0 25px 58px rgba(78,82,91,.18),inset 0 1px 0 #fff;animation:floatPlaque 6.2s ease-in-out infinite}

.header{text-align:center;padding:0 8px 9px}.title{margin:0;font-family:Marcellus,Georgia,serif;font-size:22px;line-height:1.05;letter-spacing:.045em;color:#946c58;text-shadow:0 1px 0 #fff;white-space:nowrap}.rule{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:7px}.rule i{width:42px;height:1px;background:linear-gradient(90deg,transparent,#caa477)}.rule i:last-child{background:linear-gradient(90deg,#caa477,transparent)}.rule b{font-size:9px;font-weight:500;color:#caa477}.rule i{width:42px;height:1px;background:linear-gradient(90deg,transparent,#caa477)}.rule i:last-child{background:linear-gradient(90deg,#caa477,transparent)}.rule b{font-size:9px;font-weight:500;color:#caa477}
.topGrid{display:grid;grid-template-columns:1fr 1.16fr;gap:9px}.panel{position:relative;overflow:hidden;border:1px solid rgba(181,138,98,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.84),0 8px 18px rgba(89,91,100,.05);transition:.22s ease}.panel:hover{transform:translateY(-3px);border-color:rgba(181,138,98,.48);box-shadow:inset 0 1px 0 #fff,0 12px 26px rgba(89,91,100,.09)}
