<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хроники Империи</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Marcellus&display=swap');
*{box-sizing:border-box}:root{--ink:#596575;--gold:#b58a62;--rose:#c995a5}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,#e9e3df,#e8eef2 52%,#f1e2e7);font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink)}
.chronicle{position:relative;width:min(430px,100%);overflow:hidden;padding:16px;border:1px solid rgba(181,138,98,.5);border-radius:27px;background:radial-gradient(circle at 16% 12%,rgba(255,255,255,.96),transparent 27%),radial-gradient(circle at 88% 78%,rgba(209,226,237,.4),transparent 34%),linear-gradient(145deg,#fbf4ec,#f7e9e9 55%,#edf3f6);box-shadow:0 25px 58px rgba(78,82,91,.18),inset 0 1px 0 #fff}
.chronicle:before{content:"";position:absolute;inset:7px;border:1px solid rgba(181,138,98,.17);border-radius:21px;pointer-events:none}.content{position:relative;z-index:2}
.header{text-align:center;padding:0 8px 9px}.title{margin:0;font-family:Marcellus,Georgia,serif;font-size:22px;line-height:1;letter-spacing:.045em;color:#946c58;white-space:nowrap}.rule{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px}.rule i{width:42px;height:1px;background:linear-gradient(90deg,transparent,#caa477)}.rule i:last-child{background:linear-gradient(90deg,#caa477,transparent)}.rule b{font-size:9px;color:#caa477;font-weight:500}
.topGrid{display:grid;grid-template-columns:1fr 1.16fr;gap:9px}.panel{position:relative;overflow:hidden;border:1px solid rgba(181,138,98,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.84),0 8px 18px rgba(89,91,100,.05);transition:.22s ease}.panel:hover{transform:translateY(-3px);border-color:rgba(181,138,98,.48);box-shadow:inset 0 1px 0 #fff,0 12px 26px rgba(89,91,100,.09)}
.datePanel{padding:10px 11px;border-radius:19px 25px 17px 21px;background:linear-gradient(135deg,rgba(255,252,247,.79),rgba(246,228,230,.67));display:flex;align-items:center;gap:10px}.day{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(241,218,224,.64));border:1px solid rgba(181,138,98,.2);font-family:Marcellus,Georgia,serif;font-size:24px;color:#9f7180}.small{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#b27e6e}.month{margin-top:2px;font-size:15px;line-height:1.05;font-weight:600;color:#596575;white-space:nowrap}
.momentPanel{padding:9px 10px;border-radius:24px 18px 22px 16px;background:linear-gradient(135deg,rgba(243,238,246,.76),rgba(237,247,242,.73));display:flex;align-items:center;gap:8px}.plainIcon{width:34px;height:38px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 7px rgba(175,130,105,.14))}.timeIcon{width:36px;height:40px}.moonTiny{width:21px;height:21px}.momentLine{margin-top:2px;font-size:13px;line-height:1.05;font-weight:600;color:#596475;white-space:nowrap}.weatherLine{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:11px;color:#806d76;white-space:nowrap}
.scene{margin-top:9px;padding:11px 12px 12px;border-radius:22px 18px 24px 17px;background:linear-gradient(145deg,rgba(255,252,247,.72),rgba(247,239,239,.62));position:relative}.scene-watermark{position:absolute;right:-30px;bottom:-38px;width:310px;height:195px;object-fit:contain;opacity:.15;mix-blend-mode:multiply;z-index:0;pointer-events:none;filter:saturate(.72) sepia(.08)}.sceneInner{position:relative;z-index:2}.sceneHead{display:flex;justify-content:space-between;align-items:center;padding-bottom:7px;border-bottom:1px solid rgba(181,138,98,.17)}.sceneTitle{font-family:Marcellus,Georgia,serif;font-size:12px;letter-spacing:.12em;color:#986e5e}.sceneRow{display:grid;grid-template-columns:32px 1fr;gap:8px;margin-top:9px}.sceneMark{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 3px 7px rgba(175,130,105,.12))}.sceneLabel{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#b37f6f}.sceneValue{font-size:15px;line-height:1.08;font-weight:600;color:#596575}.eventValue{font-size:14px;line-height:1.15;color:#796872}
.status{margin-top:10px;padding:10px 12px 11px;border-radius:18px 23px 17px 21px;background:linear-gradient(135deg,rgba(255,251,247,.61),rgba(238,245,248,.51))}.statusHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:7px}.statusTitle{font-family:Marcellus,Georgia,serif;font-size:12px;letter-spacing:.12em;color:#956c5b}.statusNote{font-size:10px;color:#baa19a}.statusStats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{margin:3px 0}.statRow{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#6b6870}.statRow b{font-size:14px;color:#5c6878}.track{height:8px;margin-top:4px;border-radius:999px;overflow:hidden;background:rgba(100,112,126,.07);border:1px solid rgba(255,255,255,.92)}.fill{height:100%;border-radius:999px;width:var(--lo);animation:drift var(--speed) ease-in-out infinite;animation-delay:var(--delay);box-shadow:0 0 12px var(--glow)}@keyframes drift{0%,100%{width:var(--lo)}42%,63%{width:var(--hi)}}.vigor{--lo:71%;--hi:82%;--speed:5.8s;--delay:-1.1s;--glow:rgba(232,157,181,.34);background:linear-gradient(90deg,#efb8ca,#d991aa)}.magic{--lo:62%;--hi:74%;--speed:7.7s;--delay:-4s;--glow:rgba(105,193,226,.32);background:linear-gradient(90deg,#b9e3f1,#7ec4e2)}
.footer{text-align:center;margin-top:7px;font-size:9px;letter-spacing:.22em;color:#bc9882}.footer:before,.footer:after{content:"";display:inline-block;width:34px;height:1px;vertical-align:middle;background:linear-gradient(90deg,transparent,#caa477);margin:0 7px}.footer:after{background:linear-gradient(90deg,#caa477,transparent)}
@media(max-width:390px){.topGrid{grid-template-columns:1fr}.statusStats{grid-template-columns:1fr}.title{font-size:21px}}
</style></head><body><div class="chronicle"><div class="content">
<div class="header"><div class="title">ХРОНИКИ ИМПЕРИИ</div><div class="rule"><i></i><b>◇</b><i></i></div></div>
<div class="topGrid"><div class="panel datePanel"><div class="day">14</div><div><div class="small">День</div><div class="month">Серебряной Луны</div></div></div><div class="panel momentPanel"><img class="plainIcon timeIcon" src="https://raw.githubusercontent.com/yeonorjun/jookyu-manhwa-preset/main/assets/chronicle-hourglass.svg" alt=""><div><div class="small">Время суток</div><div class="momentLine">Полночь</div><div class="weatherLine"><span>ясная ночь</span><img class="plainIcon moonTiny" src="https://raw.githubusercontent.com/yeonorjun/jookyu-manhwa-preset/main/assets/chronicle-moon.svg" alt=""></div></div></div></div>
<div class="panel scene"><img class="scene-watermark" src="https://raw.githubusercontent.com/yeonorjun/jookyu-manhwa-preset/main/assets/chronicle-castle.svg" alt=""><div class="sceneInner"><div class="sceneHead"><div class="sceneTitle">ТЕКУЩАЯ СЦЕНА</div><div style="font-size:12px;color:#c9a17f">✧</div></div><div class="sceneRow"><img class="sceneMark" src="https://raw.githubusercontent.com/yeonorjun/jookyu-manhwa-preset/main/assets/chronicle-castle.svg" alt=""><div><div class="sceneLabel">Место</div><div class="sceneValue">Северное крыло дворца</div></div></div><div class="sceneRow"><img class="sceneMark" src="https://raw.githubusercontent.com/yeonorjun/jookyu-manhwa-preset/main/assets/chronicle-butterfly.svg" alt=""><div><div class="sceneLabel">Событие</div><div class="eventValue">Тайная аудиенция с наследным принцем</div></div></div></div></div>
<div class="panel status"><div class="statusHead"><div class="statusTitle">СОСТОЯНИЕ · {{char}}</div><div class="statusNote">текущий запас</div></div><div class="statusStats"><div class="stat"><div class="statRow"><span>Бодрость</span><b>82%</b></div><div class="track"><div class="fill vigor"></div></div></div><div class="stat"><div class="statRow"><span>Мана</span><b>74%</b></div><div class="track"><div class="fill magic"></div></div></div></div></div><div class="footer">ИМПЕРСКИЙ КАЛЕНДАРЬ</div></div></div></body></html>
